<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heemsworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fountain:#d6457f;--fountain-2:#ec6fa2;--sky:#ffd9e8;
  --limestone:#ffe7f0;--stone-2:#ffdbe9;--paper:#fff7fa;
  --brick:#b8326a;--brass:#f4c56a;--ink:#2a1420;--muted:#8a5a70;--line:#f3cadb
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--limestone);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* header */
header{background:linear-gradient(90deg,#c93a74,#e8609a);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;height:64px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,var(--brass) 0 18px,transparent 18px 24px,var(--brick) 24px 42px,transparent 42px 48px)}
.logo{font-family:'Fredoka',sans-serif;font-weight:900;font-size:32px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;border-left:1px solid rgba(255,255,255,.35);padding-left:14px}
.hspace{flex:1}
.hbtn{font-weight:600;font-size:14px;padding:10px 16px;border-radius:4px;border:1.5px solid rgba(255,255,255,.55)}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.primary{background:#fff;border-color:#fff;color:var(--fountain)}
.hbtn.primary:hover{background:#ffe3ee}
.hbtn:disabled{opacity:.45;cursor:default}

/* body */
main{display:grid;grid-template-columns:1fr 420px;min-height:0}
#stage{position:relative;min-width:0;background:
  radial-gradient(ellipse 70% 45% at 50% 38%,rgba(255,255,255,.65),transparent 70%),
  linear-gradient(180deg,#ffc6dd 0%,#ffd9e8 45%,#ffeaf2 75%,#fffafc 100%)}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,250,252,0),rgba(255,250,252,.85))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.deco{position:absolute;inset:16px;border:1.5px solid rgba(214,69,127,.22);pointer-events:none;z-index:1}
.deco::before,.deco::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--fountain);opacity:.55}
.deco::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.deco::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
#empty{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:9px 16px;font-size:13px;color:var(--muted);box-shadow:0 2px 0 var(--line);white-space:nowrap}
#empty b{color:var(--ink)}
#status{position:absolute;z-index:2;left:28px;bottom:26px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.viewbtns{position:absolute;z-index:2;right:28px;bottom:22px;display:flex;gap:6px}
.viewbtns button{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:7px 11px;font-size:12px;font-weight:600}
.viewbtns button:hover{border-color:var(--fountain)}

/* panel */
#panel{background:linear-gradient(180deg,var(--paper) 0%,#ffeef5 100%);border-left:1.5px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1.5px solid var(--line)}
.tab{padding:14px 1px 12px;font-family:'Fredoka',sans-serif;font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab.on{color:var(--fountain);border-bottom-color:var(--brick)}
.tab:hover{color:var(--ink)}
.pane{flex:1;overflow:auto;padding:18px 18px 48px;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
.ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ph h2{margin:0;font-family:'Fredoka',sans-serif;font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.ph span{font-size:12px;color:var(--muted)}
.search{width:100%;padding:10px 12px;border-radius:4px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--fountain)}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:600;background:#fff}
.chip.on{background:var(--fountain);border-color:var(--fountain);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .1s}
.card:hover{border-color:var(--fountain-2)}
.card img,.card .none{width:100%;aspect-ratio:1;border-radius:2px;display:block;image-rendering:pixelated}
.card .none{background:var(--limestone);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.card b{font-size:11px;font-weight:700;color:var(--fountain)}
.card i{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{border-color:var(--brick);box-shadow:inset 0 0 0 1.5px var(--brick)}
.row{margin-bottom:20px}
.row label{display:block;font-size:11px;font-weight:700;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:4px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--brick)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--fountain)}
.wear{border-top:1.5px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px;align-items:center}
.wear .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--limestone);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px}
.pill button{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;line-height:18px}
.wear .nothing{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  #app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr}
  #stage{height:56vh}
  #panel{border-left:0;border-top:1.5px solid var(--line)}
  .tag{display:none}.logo{font-size:26px}
  .tab{font-size:14px}
  #empty{white-space:normal;width:80%;text-align:center}
}

/* ===== bubble text + glossy bubble controls ===== */
.g{display:inline-block;background:linear-gradient(180deg,#fff 0%,#fff 36%,#ffc8df 44%,#f06aa4 72%,#c93a74 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.7px rgba(150,24,84,.6);
  filter:drop-shadow(0 1.5px 0 rgba(255,255,255,.95)) drop-shadow(0 2px 3px rgba(201,58,116,.35));letter-spacing:.01em;line-height:1.15}
.g.w,.on .g,.hbtn .g,header .g{background:linear-gradient(180deg,#fff 0%,#fff 42%,#ffe2ee 50%,#ffc4dc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.9px rgba(110,0,50,.85);
  filter:drop-shadow(0 1.5px 0 rgba(120,10,60,.35)) drop-shadow(0 0 6px rgba(255,255,255,.35))}
.hbtn.primary .g{background:linear-gradient(180deg,#fff 0%,#ffd0e4 40%,#f06aa4 60%,#c93a74 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.7px rgba(150,24,84,.6);filter:drop-shadow(0 1px 0 #fff)}
.logo{font-weight:700;letter-spacing:.04em;text-transform:none;font-size:34px}
.logo .g{-webkit-text-stroke:1.2px rgba(120,10,60,.6)}
.tab{text-transform:none!important;letter-spacing:0!important;font-weight:700!important;font-size:15px!important}
.ph h2{text-transform:none;letter-spacing:0;font-weight:700;font-size:30px}
.ph h2 .g{-webkit-text-stroke:1px rgba(150,24,84,.6)}
.row label{text-transform:none;letter-spacing:.02em;font-size:14px;font-weight:700}
/* glossy bubble buttons / chips / cards */
.chip,.viewbtns button,.card,.hbtn,.pill,.search{position:relative;overflow:hidden;border-radius:999px}
#empty{position:absolute;overflow:hidden;border-radius:999px;z-index:2}
#stage{overflow:hidden}
#stage canvas{position:absolute;inset:0}
.chip,.viewbtns button{background:linear-gradient(180deg,#ffffff 0%,#fff3f8 50%,#ffe0ec 100%)!important;border:1.5px solid #f6bcd5!important;
  box-shadow:inset 0 -3px 0 rgba(214,69,127,.12),0 2px 0 rgba(214,69,127,.12)}
.chip::before,.viewbtns button::before,.card::before,.hbtn::before,.pill::before,#empty::before{content:"";position:absolute;left:10%;right:10%;top:2px;height:42%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.chip.on{background:linear-gradient(180deg,#ff9cc6 0%,#f06aa4 45%,#d6457f 100%)!important;border-color:#c93a74!important;box-shadow:inset 0 -3px 0 rgba(120,10,60,.2),0 2px 0 rgba(150,24,84,.25)}
.chip.on::before{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.hbtn{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08))!important;border:1.5px solid rgba(255,255,255,.7)!important;box-shadow:inset 0 -3px 0 rgba(120,10,60,.15)}
.hbtn::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.hbtn.primary{background:linear-gradient(180deg,#fff 0%,#ffeef5 60%,#ffd6e7 100%)!important}
.card{border-radius:18px!important;background:linear-gradient(180deg,#fff 0%,#fff5f9 100%);border:1.5px solid #f6c6da!important;box-shadow:0 2px 0 rgba(214,69,127,.12)}
.card::before{height:22%;top:1px;left:8%;right:8%;z-index:2}
.card img,.card .none{border-radius:14px!important;background:radial-gradient(circle at 50% 35%,#fff,#ffe3ee)}
.card.on{border-color:#d6457f!important;box-shadow:0 0 0 2px #f06aa4,0 3px 8px rgba(214,69,127,.3)!important}
.card b{font-weight:700}
.card i{font-family:'Fredoka';color:#9a5a78}
.pill{background:linear-gradient(180deg,#fff,#ffe3ee)!important;border:1.5px solid #f6bcd5}
.search{border-radius:999px!important;background:linear-gradient(180deg,#fff,#fff6fa)!important;border:1.5px solid #f6bcd5!important;box-shadow:inset 0 2px 4px rgba(214,69,127,.1)}
#empty{border-radius:999px!important;background:linear-gradient(180deg,#fff,#ffeef5)!important;border:1.5px solid #f6bcd5!important}
.sw button{border-radius:50%!important;position:relative;box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 3px rgba(255,255,255,.55),0 0 0 1.5px #f6bcd5!important}
.sw button.on{box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 3px rgba(255,255,255,.55),0 0 0 3px #f06aa4!important}
.card .tryon{position:absolute;right:6px;top:6px;z-index:3;font-size:9px;padding:2px 6px;border-radius:999px;background:#fff;border:1px solid #f6bcd5;color:#c93a74;opacity:0;transition:opacity .15s}
.card:hover .tryon{opacity:1}
</style>

<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 L26 14 L14 26 L2 14 Z" fill="none" stroke="#c9a24a" stroke-width="2.5"/><path d="M14 8 L20 14 L14 20 L8 14 Z" fill="#fff"/></svg>
      <span class="g w">Heemsworld</span>
    </div>
    <div class="tag"><span class="g w">Character Maker</span></div>
    <div class="hspace"></div>
    <button class="hbtn" id="random"><span class="g">Randomize</span></button>
    <button class="hbtn" id="reset"><span class="g">Strip</span></button>
    <button class="hbtn primary" id="export"><span class="g">Export .GLB</span></button>
  </header>
  <main>
    <div id="stage">
      <div class="deco"></div>
      <div id="empty"><span class="g">Your Heem starts blank — pick some clothes!</span></div>
      <div id="status"><span class="g">Drag to spin · scroll to zoom · right-drag to move</span></div>
      <div class="viewbtns"><button data-v="front"><span class="g">Front</span></button><button data-v="side"><span class="g">Side</span></button><button data-v="back"><span class="g">Back</span></button><button data-v="face"><span class="g">Face</span></button><button data-v="feet"><span class="g">Feet</span></button></div>
    </div>
    <aside id="panel">
      <nav class="tabs" id="tabs"></nav>

  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= catalog ================= */
const COLORS=[['Black','#1d1d1f'],['White','#f2f2ee'],['Red','#c8323c'],['Crimson','#8e1b2b'],['Orange','#e8742a'],['Mustard','#d6a72b'],['Lime','#8cc63f'],['Forest','#2f6b3a'],['Teal','#1f8a8a'],['Sky','#5bb4e8'],['Navy','#1f2f5c'],['Royal','#3b55c9'],['Violet','#6f42c1'],['Pink','#e77fb0'],['Tan','#c9a77c'],['Gray','#7d8088']];
const PATTERNS=['Solid','Striped','Pinstripe','Checker','Dotted','Diagonal','Gradient','Camo','Plaid'];
const RIBBED=new Set(['Longsleeve','Hoodie','Bomber','Crew','Knee-high']);
function makeCatalog(cuts,salt){
  const out=[];
  for(let i=0;i<99;i++){
    const cut=cuts[i%3],p=PATTERNS[Math.floor(i/3)%9];
    const a=COLORS[(i*7+salt)%16];let b=COLORS[(i*11+5+salt)%16];if(b===a)b=COLORS[(i*11+6+salt)%16];
    out.push({id:i+1,cut,pattern:p,c1:a[1],c2:b[1],name:`${a[0]} ${p==='Solid'?'':p+' '}${cut}`,seed:i*97+salt+1});
  }
  return out;
}
const CAT={
  shirt:makeCatalog(['Tee','Longsleeve','Tank'],0),
  pants:makeCatalog(['Jeans','Shorts','Capris'],3),
  jacket:makeCatalog(['Hoodie','Bomber','Trench'],9),
  shoes:makeCatalog(['Sneakers','Boots','Loafers'],12),
  socks:[
    {id:1,cut:'Ankle',pattern:'Solid',c1:'#f2f2ee',c2:'#f2f2ee',name:'White Ankle Socks',seed:1},
    {id:2,cut:'Crew',pattern:'Striped',c1:'#7d8088',c2:'#1d1d1f',name:'Gray Striped Crew Socks',seed:2},
    {id:3,cut:'Knee-high',pattern:'Striped',c1:'#f2f2ee',c2:'#c8323c',name:'Red Striped Knee-highs',seed:3}
  ]
};
const SKINS=['#f3d6c1','#e8bf9f','#d39f7b','#b57a52','#8a5838','#5e3b27','#3d2619'];
const HAIRC=['#151211','#3a2417','#6b4226','#a8743f','#e2c178','#b8b4ad','#a8432a','#f27aa8','#7a4fd0','#2b6fd6','#3fb58a'];
const EYES=['#3b2414','#2f6b3a','#2f63a8','#6b7178','#7a3fa8'];
const HAIRS=['None','Buzz','Bob','Pixie','Wolf Cut','Long','Curtains','Ponytail','Twin Tails','Bun','Space Buns','Braids','Dreads','Puff','Mohawk','Spiky'];
const FRAMES=['Boy','Girl'];
const STYLES=['Toon','Retro'];
const EYE_SHAPES=['Round','Almond','Sleepy','Sharp','Cat','Droopy','Sparkle','Happy'];
const BROWS=['Soft','Straight','Thick','Arched','Fierce','Worried'];
const MOUTHS=['Smile','Neutral','Smirk','Open','Grin','Pout','Oh','Cat','Frown'];
const MARKS=['None','Freckles','Rosy','Beauty mark','Bandage'];

/* ================= paint helpers ================= */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,a){const c=new THREE.Color(hex);const h={};c.getHSL(h);c.setHSL(h.h,h.s,Math.min(1,Math.max(0,h.l+a)));return '#'+c.getHexString()}
function mix(a,b,t){return '#'+new THREE.Color(a).lerp(new THREE.Color(b),t).getHexString()}
function drawPattern(ctx,s,it){
  const {pattern:p,c1,c2,seed}=it;
  ctx.fillStyle=c1;ctx.fillRect(0,0,s,s);ctx.fillStyle=c2;ctx.strokeStyle=c2;
  if(p==='Striped'){for(let y=0;y<s;y+=s/8)ctx.fillRect(0,y,s,s/16)}
  else if(p==='Pinstripe'){for(let x=0;x<s;x+=s/16)ctx.fillRect(x,0,Math.max(1,s/100),s)}
  else if(p==='Checker'){const k=s/8;for(let y=0;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2)ctx.fillRect(x*k,y*k,k,k)}
  else if(p==='Dotted'){const k=s/8;for(let y=0;y<8;y++)for(let x=0;x<9;x++){ctx.beginPath();ctx.arc(x*k+(y%2)*k/2,y*k+k/2,k/5,0,7);ctx.fill()}}
  else if(p==='Diagonal'){ctx.lineWidth=s/24;for(let i=-s;i<2*s;i+=s/6){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+s,s);ctx.stroke()}}
  else if(p==='Gradient'){const g=ctx.createLinearGradient(0,0,0,s);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,s,s)}
  else if(p==='Camo'){const r=rng(seed);const cs=[c2,shade(c1,-.18),shade(c2,.2)];for(let i=0;i<46;i++){ctx.fillStyle=cs[i%3];ctx.beginPath();ctx.ellipse(r()*s,r()*s,s*(.05+r()*.1),s*(.03+r()*.06),r()*3,0,7);ctx.fill()}}
  else if(p==='Plaid'){ctx.globalAlpha=.45;for(let i=0;i<s;i+=s/4){ctx.fillRect(i,0,s/10,s);ctx.fillRect(0,i,s,s/10)}ctx.globalAlpha=.8;ctx.fillStyle=shade(c1,.35);for(let i=s/8;i<s;i+=s/4){ctx.fillRect(i,0,Math.max(1,s/64),s);ctx.fillRect(0,i,s,Math.max(1,s/64))}ctx.globalAlpha=1}
}
function canvasTex(c,repeat=false){
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=THREE.RepeatWrapping;t.wrapT=repeat?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;return t;
}
function blob(c,x,y,rx,ry,col,a){rx=Math.abs(rx);ry=Math.abs(ry);c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.restore()}

// Hand-painted cloth: pattern + baked hem shadow, folds, highlights and ribbed cuffs
const texCache=new Map(),thumbCache=new Map();
function texFor(it){
  const k=it.name+it.seed;if(texCache.has(k))return texCache.get(k);
  const S=128,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const tile=document.createElement('canvas');tile.width=tile.height=64;drawPattern(tile.getContext('2d'),64,it);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)x.drawImage(tile,i*64,j*64);
  const r=rng(it.seed*3+7);
  for(let i=0;i<9;i++){ // fold shadows
    const fx=r()*S,fy=r()*S;x.strokeStyle=`rgba(0,0,0,${.09+r()*.08})`;x.lineWidth=2+r()*3;x.lineCap='round';
    x.beginPath();x.moveTo(fx,fy);x.quadraticCurveTo(fx+r()*24-12,fy+12,fx+r()*30-15,fy+22+r()*18);x.stroke();

const hairTexCache=new Map();

  const c=document.createElement('canvas');c.width=64;c.height=128;const x=c.getContext('2d'),r=rng(col.length*97+parseInt(col.slice(1),16)%999);
  const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,shade(col,.04));g.addColorStop(1,shade(col,-.12));x.fillStyle=g;x.fillRect(0,0,64,128);

  for(let i=0;i<10;i++){x.fillStyle=`rgba(255,255,255,${.05+r()*.06})`;x.fillRect(Math.floor(r()*64),0,1,128)}
  x.fillStyle=shade(col,.13);for(let i=0;i<64;i+=2){const h=3+Math.floor(r()*6);x.fillRect(i,23+Math.floor(r()*3),2,h)}  // soft shine band ("angel ring")

}

const CLOTH={wrinkle:.05};
// densify a ring list so drapes bend smoothly
function dense(R,n=3){const out=[];for(let i=0;i<R.length-1;i++){for(let k=0;k<n;k++)out.push(lerpRing(R[i],R[i+1],k/n))}out.push(R.at(-1));return out}
// torso: below the chest, cloth falls straight from the chest/shoulders (never pulls in at the waist), with optional flare
function drapeTorso(R,off,flare=0,ease=.97){
  const chest=A.torso.filter(r=>r.y>1.2&&r.y<1.45).reduce((a,r)=>r.w>a.w?r:a);
  const ymin=Math.min(...R.map(r=>r.y));
  return dense(R).map(r=>{
    if(r.y>=chest.y)return{...r,w:r.w+off,d:r.d+off};
    const t=(chest.y-r.y)/(chest.y-ymin||1);
    return{...r,w:Math.max(r.w,chest.w*ease)+off+flare*t,d:Math.max(r.d,chest.d*ease)+off+flare*t*.75,z:(r.z||0)*(1-t)+(chest.z||0)*t*.5};
  });
}
// limbs: radius follows a loose profile from the shoulder/thigh down; cuff=true gathers the last bit
function drapeLimb(R,ref,off,profile,cuff=false){
  const top=R[0].y,bot=R.at(-1).y,D=dense(R);
  const out=D.map(r=>{const t=(top-r.y)/(top-bot||1),p=profile(t);
    if(r.y>-.01){const k=Math.max(0,Math.min(1,(-r.y+.035)/.045));return{...r,w:r.w+off+(ref.w*p-r.w)*Math.max(0,k)*.35,d:r.d+off+(ref.d*p-r.d)*Math.max(0,k)*.35}}
    return{...r,w:Math.max(r.w+off,ref.w*p+off),d:Math.max(r.d+off,ref.d*p+off)}});
  if(cuff){const last=out.at(-1),src=D.at(-1),cy=last.y+.035;
    out.splice(out.length-1,0,{...ringAt(out,cy),y:cy});out[out.length-1]={...last,w:src.w+off+.006,d:src.d+off+.006}}
  return out;
}

  // sleeves: snug shoulder seam + loose sleeve + ribbed or plain cuff
  const ref=ringAt(A.arm,-.02),sp={Hoodie:t=>1.0-.1*t,Bomber:t=>1.04-.08*t,Trench:t=>.98+.06*t}[it.cut];
  const sleeve=drapeLimb(sub(A.arm,-.005,-.5,0),ref,.026,sp);
  const cuffR=sub(A.arm,-.49,-.53,.016);
  onLimbs(J,'arm',()=>{const g=new THREE.Group();
    g.add(mesh(loft(sub(A.arm,.037,-.01,.024),9,[true,false]),m,'JacketShoulder'));
    g.add(mesh(loft(sleeve,10,[false,false],{...CLOTH,seed:6}),m,'JacketSleeve'));
    if(!trench)g.add(mesh(loft(cuffR,10,[false,false]),rib,'Cuff'));
    return g},'JacketSleeve');
  // hem: ribbed, gathered band (hoodie/bomber); plain turned hem (trench)
  const hem=body.slice(0,3).map((r,k)=>({...r,w:r.w-(trench?0:.014)+k*.004,d:r.d-(trench?0:.012)+k*.004}));
  hem.splice(2);hem[1]={...hem[1],y:yb+(trench?.025:.05)};
  J.add(mesh(loft(hem,16,[false,false],{arc}),trench?m:rib,'Hem'));
  if(hood){
    // hood down: a cowl lying on the upper back, open toward the face, with a darker lining
    const rings=[{y:1.45,w:.165,d:.125,z:-.01},{y:1.5,w:.16,d:.13,z:-.035},{y:1.55,w:.14,d:.12,z:-.065},{y:1.585,w:.1,d:.09,z:-.09},{y:1.6,w:.04,d:.045,z:-.105}];
    J.add(mesh(loft(rings,16,[false,false],{arc:[1.05,2*P-1.05],...CLOTH,seed:9}),m,'Hood'));
    J.add(mesh(loft(rings.slice(0,4).map(r=>({...r,w:r.w-.008,d:r.d-.008})),16,[false,false],{arc:[1.1,2*P-1.1]}),plain(shade(it.c1,-.3),'HoodLining'),'HoodLining'));
    // drawstrings with tips
    const tie=plain('#f4efe6','Drawstring');
    for(const sx of [-1,1]){const p=onRing(body,1.5,sx*.32,.006);J.add(mesh(cord([[p[0],1.5,p[2]],[p[0]+sx*.004,1.43,p[2]+.012],[p[0]+sx*.002,1.36,p[2]+.016]],.0045),tie,'Drawstring'));
      const tip=mesh(loft([{y:1.365,w:.006,d:.006},{y:1.34,w:.006,d:.006}],5),plain('#c9c2b4','Aglet'),'Aglet');tip.position.set(p[0]+sx*.002,0,p[2]+.016);J.add(tip)}
    // kangaroo pocket: a patch that follows the belly curve, with a stitched top edge
    const pk=sub(body,1.0,1.13,.006).map(r=>({...r,w:r.w,d:r.d}));
    J.add(mesh(loft(pk,16,[false,false],{arc:[-.62,.62]}),m,'Pocket'));
    for(const sx of [-1,1]){const a=onRing(body,1.13,sx*.62,.008),b=onRing(body,1.0,sx*.5,.008);J.add(mesh(cord([a,b],.0035),trim,'PocketEdge'))}
    J.add(mesh(cord([onRing(body,1.13,-.62,.009),onRing(body,1.13,0,.009),onRing(body,1.13,.62,.009)].map((q,k)=>k===1?q:q),.003),trim,'PocketTop'));
  }
  if(bomber){
    // ribbed collar, zipper edges, slanted welt pockets
    const col=sub(A.torso,1.515,1.56,.028);J.add(mesh(loft(col,14,[false,false],{arc}),rib,'Collar'));
    for(const sx of [-1,1]){const pts=[];for(let y=yb+.01;y<=1.53;y+=.04)pts.push(onRing(body,y,sx*gap,.002));J.add(mesh(cord(pts,.0055),plain('#b9b4aa','Zipper'),'Zipper'));
      J.add(mesh(cord([onRing(body,1.06,sx*1.0,.004),onRing(body,1.15,sx*.75,.004)],.005),trim,'WeltPocket'))}
  }
  if(trench){
    // lapels folded open, belt with buckle, double-breasted buttons
    for(const sx of [-1,1]){
      const L=[];for(const [y,a,ofs] of [[1.54,.5,.03],[1.47,.42,.035],[1.38,.3,.032],[1.3,.2,.026]])L.push(onRing(body,y,sx*a,ofs));
      const lap=new THREE.BufferGeometry(),inner=L.map(p=>[p[0]*.82,p[1],p[2]+.004]);
      const v=[];for(let k=0;k<L.length-1;k++){v.push(...L[k],...inner[k],...L[k+1],...inner[k],...inner[k+1],...L[k+1])}
      lap.setAttribute('position',new THREE.Float32BufferAttribute(v,3));lap.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(v.length/3*2),2));lap.computeVertexNormals();
      J.add(mesh(lap,mat({color:shade(it.c1,-.08),side:THREE.DoubleSide},'Lapel'),'Lapel'));
      for(const y of [1.3,1.2,1.06])J.add(Object.assign(mesh(new THREE.IcosahedronGeometry(.009,1),plain('#2a211b','Button'),'Button'),{}).translateX(onRing(body,y,sx*.32,.006)[0]).translateY(y).translateZ(onRing(body,y,sx*.32,.006)[2]));
    }
    const bl=sub(body,1.08,1.12,.006);J.add(mesh(loft(bl,16,[false,false],{arc}),trim,'Belt'));
    const bk=mesh(new THREE.BoxGeometry(.04,.034,.008),plain('#c9a24a','Buckle'),'Buckle');const bp=onRing(body,1.1,.0001,.01);bk.position.set(.05,1.1,bp[2]-.004);J.add(bk);
    J.add(mesh(loft(sub(A.torso,1.515,1.57,.03),14,[false,false],{arc:[.25,2*P-.25]}),m,'Collar'));
  }
  outline(J);
}
const BUILD={shirt:buildShirt,pants:buildPants,jacket:buildJacket,shoes:buildShoes,socks:buildSocks};
function buildAll(){A=anatomy();buildBody();buildHair();for(const k in BUILD)BUILD[k]();applyShape();updateWear()}
function applyShape(){root.scale.set(state.build,state.height,state.build)}

/* ================= 3D clothing previews ================= */
const PREV=144;
const thumbR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});thumbR.setSize(PREV,PREV);thumbR.setPixelRatio(1);thumbR.outputColorSpace=THREE.SRGBColorSpace;
const tScene=new THREE.Scene();tScene.add(new THREE.HemisphereLight(0xfff6fb,0x8a6a7a,1.7));{const d=new THREE.DirectionalLight(0xffffff,2.1);d.position.set(1.5,3,3);tScene.add(d)}
const tCam=new THREE.PerspectiveCamera(30,1,.01,10);
const SHOT={shirt:[[.5,1.33,1.55],[0,1.22,0]],jacket:[[.6,1.3,2.0],[0,1.12,0]],pants:[[.55,.72,2.05],[0,.52,0]],shoes:[[.32,.28,.55],[0,.04,.06]],socks:[[.42,.42,1.0],[0,.2,0]]};
const previewCache=new Map();let previewQueue=[],previewGen=0;
function previewKey(cat,id){return cat+id+'|'+state.frame+state.style}
function renderPreview(cat,id){
  const key=previewKey(cat,id);if(previewCache.has(key))return previewCache.get(key);
  const live=G[cat],prev=state[cat];G[cat]=new THREE.Group();state[cat]=id;
  BUILD[cat]();tScene.add(G[cat]);
  tCam.position.set(...SHOT[cat][0]);tCam.lookAt(...SHOT[cat][1]);thumbR.render(tScene,tCam);
  const url=thumbR.domElement.toDataURL('image/png');
  tScene.remove(G[cat]);clear(G[cat]);G[cat]=live;state[cat]=prev;
  previewCache.set(key,url);return url;
}
function pumpPreviews(){
  const gen=previewGen,t0=performance.now();
  while(previewQueue.length&&performance.now()-t0<14){const {cat,id,img}=previewQueue.shift();if(img.isConnected)img.src=renderPreview(cat,id)}
  if(previewQueue.length&&gen===previewGen)requestAnimationFrame(pumpPreviews);
}
// hover to try on, click to keep
let tryCat=null,tryPrev=null;
function tryOn(cat,id){if(tryCat===null){tryCat=cat;tryPrev=state[cat]}state[cat]=id;BUILD[cat]()}
function tryOff(){if(tryCat===null)return;state[tryCat]=tryPrev;BUILD[tryCat]();tryCat=null;tryPrev=null}
const canHover=matchMedia('(hover:hover)').matches;

/* ================= UI ================= */
const TABS=[['body','Body'],['face','Face'],['shirt','Shirts'],['pants','Pants'],['jacket','Jackets'],['shoes','Shoes'],['socks','Socks']];
let tab='body',query='',cutFilter='';
const tabsEl=document.getElementById('tabs'),pane=document.getElementById('pane');
function renderTabs(){tabsEl.innerHTML='';for(const [k,l] of TABS){const b=document.createElement('button');b.className='tab'+(tab===k?' on':'');b.innerHTML=gl(l);b.onclick=()=>{tryOff();tab=k;query='';cutFilter='';renderTabs();renderPane();if(k==='face')view('face')};tabsEl.appendChild(b)}}
const gl=t=>`<span class="g">${t}</span>`;
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
function swatches(label,list,key,onPick){
  const r=el(`<div class="row"><label>${gl(label)}</label><div class="sw"></div></div>`),w=r.lastChild;
  list.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.className=state[key]===i?'on':'';b.setAttribute('aria-label',label+' '+(i+1));b.onclick=()=>{state[key]=i;onPick();renderPane()};w.appendChild(b)});return r}
function chips(label,list,key,onPick,byValue=false){
  const r=el(`<div class="row"><label>${gl(label)}</label><div class="chips"></div></div>`),w=r.lastChild;
  list.forEach((c,i)=>{const v=byValue?c:i,b=document.createElement('button');b.innerHTML=gl(c);b.className='chip'+(state[key]===v?' on':'');b.onclick=()=>{state[key]=v;onPick();renderPane()};w.appendChild(b)});return r}
function slider(label,key,min,max){
  const r=el(`<div class="row"><label>${gl(label)}</label></div>`),s=document.createElement('input');s.type='range';s.min=min;s.max=max;s.step=.01;s.value=state[key];s.oninput=()=>{state[key]=+s.value;applyShape()};r.appendChild(s);return r}
function renderPane(){
  pane.innerHTML='';
  if(tab==='face'){
    const n=EYE_SHAPES.length*BROWS.length*MOUTHS.length*EYES.length*MARKS.length;
    pane.appendChild(el(`<div class="ph"><h2>${gl('Face')}</h2><span>${gl(n.toLocaleString()+' combos')}</span></div>`));
    const rf=el(`<div class="row"><button class="chip">${gl('🎲 Random face')}</button></div>`);
    rf.firstChild.onclick=()=>{const r=k=>Math.floor(Math.random()*k);Object.assign(state,{eyeShape:r(EYE_SHAPES.length),brow:r(BROWS.length),mouth:r(MOUTHS.length),eyes:r(EYES.length),mark:r(MARKS.length)});buildBody();renderPane()};
    pane.appendChild(rf);
    pane.appendChild(chips('Eyes',EYE_SHAPES,'eyeShape',buildBody));
    pane.appendChild(swatches('Eye color',EYES,'eyes',buildBody));
    pane.appendChild(chips('Brows',BROWS,'brow',buildBody));
    pane.appendChild(chips('Mouth',MOUTHS,'mouth',buildBody));
    pane.appendChild(chips('Details',MARKS,'mark',buildBody));
    return;
  }
  if(tab==='body'){
    pane.appendChild(el(`<div class="ph"><h2>${gl('Body')}</h2><span>${gl('Base mannequin')}</span></div>`));
    pane.appendChild(chips('Render style',STYLES,'style',buildAll,true));
    pane.appendChild(chips('Gender',FRAMES,'frame',buildAll));
    pane.appendChild(swatches('Skin tone',SKINS,'skin',buildBody));
    pane.appendChild(chips('Hair',HAIRS,'hair',buildHair));
    pane.appendChild(swatches('Hair color',HAIRC,'hairColor',()=>{buildHair();buildBody()}));
    pane.appendChild(slider('Height','height',.9,1.1));
    pane.appendChild(slider('Build','build',.88,1.18));
    return;
  }
  const list=CAT[tab],label=TABS.find(t=>t[0]===tab)[1];
  pane.appendChild(el(`<div class="ph"><h2>${gl(label)}</h2><span>${gl(list.length+' styles · hover to try on')}</span></div>`));
  const grid=document.createElement('div');grid.className='grid';
  if(list.length>3){
    const s=el(`<input class="search" placeholder="Search by colour, pattern or number">`);s.value=query;s.oninput=()=>{query=s.value;fill()};pane.appendChild(s);
    const f=el(`<div class="filters"></div>`);
    ['All',...new Set(list.map(i=>i.cut))].forEach(c=>{const b=el(`<button class="chip">${gl(c)}</button>`);const v=c==='All'?'':c;if(cutFilter===v)b.classList.add('on');b.onclick=()=>{cutFilter=v;f.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));fill()};f.appendChild(b)});
    pane.appendChild(f);
  }
  pane.appendChild(grid);
  function fill(){
    grid.innerHTML='';const q=query.trim().toLowerCase();
    const items=list.filter(it=>(!cutFilter||it.cut===cutFilter)&&(!q||it.name.toLowerCase().includes(q)||String(it.id)===q.replace('#','')));
    const none=el(`<button class="card${state[tab]===0?' on':''}"><div class="none">${gl('None')}</div><b>${gl('—')}</b><i>Nothing</i></button>`);none.onclick=()=>{tryCat=null;pick(0)};grid.appendChild(none);
    previewGen++;previewQueue=[];
    for(const it of items){
      const key=previewKey(tab,it.id),cached=previewCache.get(key);
      const b=el(`<button class="card${state[tab]===it.id?' on':''}" title="${it.name}"><span class="tryon">try on</span><img alt="${it.name}" src="${cached||thumbFor(it)}"><b>${gl('#'+String(it.id).padStart(2,'0'))}</b><i>${it.name}</i></button>`);
      if(!cached)previewQueue.push({cat:tab,id:it.id,img:b.querySelector('img')});
      b.onclick=()=>{tryCat=null;tryPrev=null;pick(it.id)};
      if(canHover){b.onmouseenter=()=>tryOn(tab,it.id);b.onmouseleave=tryOff}
      grid.appendChild(b)}
    requestAnimationFrame(pumpPreviews);
  }
  function pick(id){state[tab]=id;BUILD[tab]();updateWear();fill()}
  fill();
}
function updateWear(){
  const w=document.getElementById('wear');w.innerHTML=`<span class="lbl">${gl('Wearing')}</span>`;
  let any=false;
  for(const k of ['shirt','pants','jacket','shoes','socks']){if(!state[k])continue;any=true;
    const p=el(`<span class="pill">${gl(CAT[k][state[k]-1].name)}<button aria-label="Remove">×</button></span>`);p.lastChild.onclick=()=>{state[k]=0;BUILD[k]();updateWear();if(tab===k)renderPane()};w.appendChild(p)}
  if(!any)w.appendChild(el(`<span class="nothing">${gl('Nothing yet')}</span>`));
  document.getElementById('empty').style.display=any?'none':'';
}
const toastEl=document.getElementById('toast');let tt;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2600)}
document.getElementById('random').onclick=()=>{
  const r=n=>Math.floor(Math.random()*n);
  Object.assign(state,{eyeShape:r(EYE_SHAPES.length),brow:r(BROWS.length),mouth:r(MOUTHS.length),mark:Math.random()<.6?0:r(MARKS.length),frame:r(2),skin:r(SKINS.length),hair:1+r(HAIRS.length-1),hairColor:r(HAIRC.length),eyes:r(EYES.length),shirt:1+r(99),pants:1+r(99),jacket:Math.random()<.4?1+r(99):0,shoes:1+r(99),socks:1+r(3)});
  buildAll();renderPane();
};
document.getElementById('reset').onclick=()=>{for(const k in BUILD)state[k]=0;buildAll();renderPane()};

/* ================= GLB export ================= */
let downloads=null;
try{window.claude?.use?.('downloads').then(d=>{downloads=d}).catch(()=>{})}catch(e){}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipOne(name,data){
  const nb=new TextEncoder().encode(name),crc=crc32(data),L=data.length;
  const put=(dv,arr)=>arr.forEach(([o,v,s])=>s===4?dv.setUint32(o,v,true):dv.setUint16(o,v,true));
  const lh=new DataView(new ArrayBuffer(30));put(lh,[[0,0x04034b50,4],[4,20,2],[12,0x21,2],[14,crc,4],[18,L,4],[22,L,4],[26,nb.length,2]]);
  const cd=new DataView(new ArrayBuffer(46));put(cd,[[0,0x02014b50,4],[4,20,2],[6,20,2],[14,0x21,2],[16,crc,4],[20,L,4],[24,L,4],[28,nb.length,2]]);
  const end=new DataView(new ArrayBuffer(22));put(end,[[0,0x06054b50,4],[8,1,2],[10,1,2],[12,46+nb.length,4],[16,30+nb.length+L,4]]);
  return new Blob([lh,nb,data,cd,nb,end]);
}
function setOutlines(v){root.traverse(o=>{if(o.userData.outline)o.visible=v})}
document.getElementById('export').onclick=()=>{
  toast('Building .glb…');setOutlines(false);root.updateMatrixWorld(true);
  new GLTFExporter().parse(root,async buf=>{
    setOutlines(true);
    const bytes=new Uint8Array(buf),kb=(bytes.length/1024).toFixed(0);
    if(downloads){
      try{await downloads.save({filename:'heemsworld-character.zip',data:zipOne('heemsworld-character.glb',bytes)});toast(`Saved heemsworld-character.glb (${kb} KB, in a .zip)`)}
      catch(e){toast(e?.code==='declined'?'Export cancelled':'Export failed: '+(e?.message||e?.code||e))}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));a.download='heemsworld-character.glb';document.body.appendChild(a);a.click();a.remove();
      toast(`Exported heemsworld-character.glb (${kb} KB)`);
    }
  },err=>{setOutlines(true);toast('Export failed: '+err)},{binary:true,onlyVisible:true});
};

/* ================= loop ================= */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
renderer.setAnimationLoop(()=>{stepFly();clampTarget();controls.update();renderer.render(scene,camera)});
buildAll();renderTabs();renderPane();
window.__heems={root,state,CAT,buildAll,camera,controls,view,exportTest:()=>new Promise((res,rej)=>{setOutlines(false);new GLTFExporter().parse(root,b=>{setOutlines(true);res(b.byteLength)},rej,{binary:true,onlyVisible:true})})};
</script>
