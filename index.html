<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heemsworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fountain:#d6457f;--fountain-2:#ec6fa2;--sky:#ffd9e8;
  --limestone:#ffe7f0;--stone-2:#ffdbe9;--paper:#fff7fa;
  --brick:#b8326a;--brass:#f4c56a;--ink:#2a1420;--muted:#8a5a70;--line:#f3cadb
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--limestone);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* header */
header{background:linear-gradient(90deg,#c93a74,#e8609a);color:#fff;display:flex;align-items:center;gap:18px;padding:0 22px;height:64px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(90deg,var(--brass) 0 18px,transparent 18px 24px,var(--brick) 24px 42px,transparent 42px 48px)}
.logo{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:32px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:10px}
.logo svg{width:28px;height:28px}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;border-left:1px solid rgba(255,255,255,.35);padding-left:14px}
.hspace{flex:1}
.hbtn{font-weight:600;font-size:14px;padding:10px 16px;border-radius:4px;border:1.5px solid rgba(255,255,255,.55)}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.primary{background:#fff;border-color:#fff;color:var(--fountain)}
.hbtn.primary:hover{background:#ffe3ee}
.hbtn:disabled{opacity:.45;cursor:default}

/* body */
main{display:grid;grid-template-columns:1fr 420px;min-height:0}
#stage{position:relative;min-width:0;background:
  radial-gradient(ellipse 70% 45% at 50% 38%,rgba(255,255,255,.65),transparent 70%),
  linear-gradient(180deg,#ffc6dd 0%,#ffd9e8 45%,#ffeaf2 75%,#fffafc 100%)}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,250,252,0),rgba(255,250,252,.85))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.deco{position:absolute;inset:16px;border:1.5px solid rgba(214,69,127,.22);pointer-events:none;z-index:1}
.deco::before,.deco::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--fountain);opacity:.55}
.deco::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.deco::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
#empty{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:9px 16px;font-size:13px;color:var(--muted);box-shadow:0 2px 0 var(--line);white-space:nowrap}
#empty b{color:var(--ink)}
#status{position:absolute;z-index:2;left:28px;bottom:26px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.viewbtns{position:absolute;z-index:2;right:28px;bottom:22px;display:flex;gap:6px}
.viewbtns button{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:7px 11px;font-size:12px;font-weight:600}
.viewbtns button:hover{border-color:var(--fountain)}

/* panel */
#panel{background:linear-gradient(180deg,var(--paper) 0%,#ffeef5 100%);border-left:1.5px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1.5px solid var(--line)}
.tab{padding:14px 2px 12px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab.on{color:var(--fountain);border-bottom-color:var(--brick)}
.tab:hover{color:var(--ink)}
.pane{flex:1;overflow:auto;padding:18px 18px 48px;-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
.ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ph h2{margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
.ph span{font-size:12px;color:var(--muted)}
.search{width:100%;padding:10px 12px;border-radius:4px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14px;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--fountain)}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:600;background:#fff}
.chip.on{background:var(--fountain);border-color:var(--fountain);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .1s}
.card:hover{border-color:var(--fountain-2)}
.card img,.card .none{width:100%;aspect-ratio:1;border-radius:2px;display:block;image-rendering:pixelated}
.card .none{background:var(--limestone);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.card b{font-size:11px;font-weight:700;color:var(--fountain)}
.card i{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{border-color:var(--brick);box-shadow:inset 0 0 0 1.5px var(--brick)}
.row{margin-bottom:20px}
.row label{display:block;font-size:11px;font-weight:700;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border-radius:4px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2.5px var(--brick)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--fountain)}
.wear{border-top:1.5px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:6px;min-height:52px;align-items:center}
.wear .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--limestone);border-radius:999px;padding:4px 6px 4px 10px;font-size:12px}
.pill button{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;line-height:18px}
.wear .nothing{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  #app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr}
  #stage{height:56vh}
  #panel{border-left:0;border-top:1.5px solid var(--line)}
  .tag{display:none}.logo{font-size:26px}
  .tab{font-size:14px}
  #empty{white-space:normal;width:80%;text-align:center}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 L26 14 L14 26 L2 14 Z" fill="none" stroke="#c9a24a" stroke-width="2.5"/><path d="M14 8 L20 14 L14 20 L8 14 Z" fill="#fff"/></svg>
      Heemsworld
    </div>
    <div class="tag">Character Maker</div>
    <div class="hspace"></div>
    <button class="hbtn" id="random">Randomize</button>
    <button class="hbtn" id="reset">Strip</button>
    <button class="hbtn primary" id="export">Export .GLB</button>
  </header>
  <main>
    <div id="stage">
      <div class="deco"></div>
      <div id="empty">Your Heem starts <b>blank</b>. Pick a shirt, pants, jacket, shoes or socks.</div>
      <div id="status">Drag to rotate · scroll to zoom where you point · right-drag to move</div>
      <div class="viewbtns"><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="back">Back</button><button data-v="face">Face</button><button data-v="feet">Feet</button></div>
    </div>
    <aside id="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="pane" id="pane"></div>
      <div class="wear" id="wear"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= catalog ================= */
const COLORS=[['Black','#1d1d1f'],['White','#f2f2ee'],['Red','#c8323c'],['Crimson','#8e1b2b'],['Orange','#e8742a'],['Mustard','#d6a72b'],['Lime','#8cc63f'],['Forest','#2f6b3a'],['Teal','#1f8a8a'],['Sky','#5bb4e8'],['Navy','#1f2f5c'],['Royal','#3b55c9'],['Violet','#6f42c1'],['Pink','#e77fb0'],['Tan','#c9a77c'],['Gray','#7d8088']];
const PATTERNS=['Solid','Striped','Pinstripe','Checker','Dotted','Diagonal','Gradient','Camo','Plaid'];
const RIBBED=new Set(['Longsleeve','Hoodie','Bomber','Crew','Knee-high']);
function makeCatalog(cuts,salt){
  const out=[];
  for(let i=0;i<99;i++){
    const cut=cuts[i%3],p=PATTERNS[Math.floor(i/3)%9];
    const a=COLORS[(i*7+salt)%16];let b=COLORS[(i*11+5+salt)%16];if(b===a)b=COLORS[(i*11+6+salt)%16];
    out.push({id:i+1,cut,pattern:p,c1:a[1],c2:b[1],name:`${a[0]} ${p==='Solid'?'':p+' '}${cut}`,seed:i*97+salt+1});
  }
  return out;
}
const CAT={
  shirt:makeCatalog(['Tee','Longsleeve','Tank'],0),
  pants:makeCatalog(['Jeans','Shorts','Capris'],3),
  jacket:makeCatalog(['Hoodie','Bomber','Trench'],9),
  shoes:makeCatalog(['Sneakers','Boots','Loafers'],12),
  socks:[
    {id:1,cut:'Ankle',pattern:'Solid',c1:'#f2f2ee',c2:'#f2f2ee',name:'White Ankle Socks',seed:1},
    {id:2,cut:'Crew',pattern:'Striped',c1:'#7d8088',c2:'#1d1d1f',name:'Gray Striped Crew Socks',seed:2},
    {id:3,cut:'Knee-high',pattern:'Striped',c1:'#f2f2ee',c2:'#c8323c',name:'Red Striped Knee-highs',seed:3}
  ]
};
const SKINS=['#f3d6c1','#e8bf9f','#d39f7b','#b57a52','#8a5838','#5e3b27','#3d2619'];
const HAIRC=['#151211','#3a2417','#6b4226','#a8743f','#e2c178','#b8b4ad','#a8432a','#f27aa8','#7a4fd0','#2b6fd6','#3fb58a'];
const EYES=['#3b2414','#2f6b3a','#2f63a8','#6b7178','#7a3fa8'];
const HAIRS=['None','Buzz','Bob','Pixie','Wolf Cut','Long','Curtains','Ponytail','Twin Tails','Bun','Space Buns','Braids','Dreads','Puff','Mohawk','Spiky'];
const FRAMES=['Boy','Girl'];
const STYLES=['Toon','Retro'];

/* ================= paint helpers ================= */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,a){const c=new THREE.Color(hex);const h={};c.getHSL(h);c.setHSL(h.h,h.s,Math.min(1,Math.max(0,h.l+a)));return '#'+c.getHexString()}
function mix(a,b,t){return '#'+new THREE.Color(a).lerp(new THREE.Color(b),t).getHexString()}
function drawPattern(ctx,s,it){
  const {pattern:p,c1,c2,seed}=it;
  ctx.fillStyle=c1;ctx.fillRect(0,0,s,s);ctx.fillStyle=c2;ctx.strokeStyle=c2;
  if(p==='Striped'){for(let y=0;y<s;y+=s/8)ctx.fillRect(0,y,s,s/16)}
  else if(p==='Pinstripe'){for(let x=0;x<s;x+=s/16)ctx.fillRect(x,0,Math.max(1,s/100),s)}
  else if(p==='Checker'){const k=s/8;for(let y=0;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2)ctx.fillRect(x*k,y*k,k,k)}
  else if(p==='Dotted'){const k=s/8;for(let y=0;y<8;y++)for(let x=0;x<9;x++){ctx.beginPath();ctx.arc(x*k+(y%2)*k/2,y*k+k/2,k/5,0,7);ctx.fill()}}
  else if(p==='Diagonal'){ctx.lineWidth=s/24;for(let i=-s;i<2*s;i+=s/6){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+s,s);ctx.stroke()}}
  else if(p==='Gradient'){const g=ctx.createLinearGradient(0,0,0,s);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,s,s)}
  else if(p==='Camo'){const r=rng(seed);const cs=[c2,shade(c1,-.18),shade(c2,.2)];for(let i=0;i<46;i++){ctx.fillStyle=cs[i%3];ctx.beginPath();ctx.ellipse(r()*s,r()*s,s*(.05+r()*.1),s*(.03+r()*.06),r()*3,0,7);ctx.fill()}}
  else if(p==='Plaid'){ctx.globalAlpha=.45;for(let i=0;i<s;i+=s/4){ctx.fillRect(i,0,s/10,s);ctx.fillRect(0,i,s,s/10)}ctx.globalAlpha=.8;ctx.fillStyle=shade(c1,.35);for(let i=s/8;i<s;i+=s/4){ctx.fillRect(i,0,Math.max(1,s/64),s);ctx.fillRect(0,i,s,Math.max(1,s/64))}ctx.globalAlpha=1}
}
function canvasTex(c,repeat=false){
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=THREE.RepeatWrapping;t.wrapT=repeat?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;return t;
}
function blob(c,x,y,rx,ry,col,a){rx=Math.abs(rx);ry=Math.abs(ry);c.save();c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();c.restore()}

// Hand-painted cloth: pattern + baked hem shadow, folds, highlights and ribbed cuffs
const texCache=new Map(),thumbCache=new Map();
function texFor(it){
  const k=it.name+it.seed;if(texCache.has(k))return texCache.get(k);
  const S=128,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const tile=document.createElement('canvas');tile.width=tile.height=64;drawPattern(tile.getContext('2d'),64,it);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)x.drawImage(tile,i*64,j*64);
  const r=rng(it.seed*3+7);
  for(let i=0;i<9;i++){ // fold shadows
    const fx=r()*S,fy=r()*S;x.strokeStyle=`rgba(0,0,0,${.09+r()*.08})`;x.lineWidth=2+r()*3;x.lineCap='round';
    x.beginPath();x.moveTo(fx,fy);x.quadraticCurveTo(fx+r()*24-12,fy+12,fx+r()*30-15,fy+22+r()*18);x.stroke();
    x.strokeStyle=`rgba(255,255,255,${.06+r()*.06})`;x.lineWidth=1.5;x.beginPath();x.moveTo(fx+3,fy);x.quadraticCurveTo(fx+r()*24-9,fy+12,fx+r()*30-12,fy+20+r()*14);x.stroke();
  }
  const g=x.createLinearGradient(0,0,0,S);g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(.08,'rgba(0,0,0,0)');g.addColorStop(.9,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');
  x.fillStyle=g;x.fillRect(0,0,S,S);
  if(RIBBED.has(it.cut)){for(const y0 of [S-10]){x.fillStyle=shade(it.c1,-.1);x.fillRect(0,y0,S,10);x.fillStyle='rgba(0,0,0,.22)';for(let i=0;i<S;i+=4)x.fillRect(i,y0,1,10)}}
  const t=canvasTex(c);texCache.set(k,t);return t;
}
function thumbFor(it){
  const k=it.name+it.seed;if(thumbCache.has(k))return thumbCache.get(k);
  const c=document.createElement('canvas');c.width=c.height=32;drawPattern(c.getContext('2d'),32,it);
  const u=c.toDataURL();thumbCache.set(k,u);return u;
}

/* ================= materials ================= */
const gradData=new Uint8Array([150,255]);
const GRAD=new THREE.DataTexture(gradData,2,1,THREE.RedFormat);GRAD.magFilter=GRAD.minFilter=THREE.NearestFilter;GRAD.needsUpdate=true;
function mat(o,name){
  const m=state.style==='Toon'?new THREE.MeshToonMaterial({...o,gradientMap:GRAD}):new THREE.MeshStandardMaterial({...o,roughness:.85,metalness:0});
  m.name=name;return m;
}
const plain=(hex,name)=>mat({color:hex},name);
const clothMat=(it,name)=>mat({map:texFor(it)},name);
const outlineMat=new THREE.MeshBasicMaterial({color:0x1b1511,side:THREE.BackSide});
outlineMat.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','vec3 transformed = position + normal * 0.004;')};

/* ================= loft geometry ================= */
function lerpRing(a,b,t){return{y:a.y+(b.y-a.y)*t,w:a.w+(b.w-a.w)*t,d:a.d+(b.d-a.d)*t,x:(a.x||0)+((b.x||0)-(a.x||0))*t,z:(a.z||0)+((b.z||0)-(a.z||0))*t}}
function ringAt(R,y){
  for(let i=0;i<R.length-1;i++){const a=R[i],b=R[i+1],lo=Math.min(a.y,b.y),hi=Math.max(a.y,b.y);if(y>=lo-1e-9&&y<=hi+1e-9)return lerpRing(a,b,(y-a.y)/(b.y-a.y))}
  const e=Math.abs(y-R[0].y)<Math.abs(y-R.at(-1).y)?R[0]:R.at(-1);return{...e,y};
}
function sub(R,y0,y1,off=0,extra={}){
  const lo=Math.min(y0,y1),hi=Math.max(y0,y1),asc=R.at(-1).y>R[0].y;
  const mid=R.filter(r=>r.y>lo+1e-6&&r.y<hi-1e-6);
  const out=asc?[ringAt(R,lo),...mid,ringAt(R,hi)]:[ringAt(R,hi),...mid,ringAt(R,lo)];
  return out.map(r=>({...r,w:r.w+off+(extra.w||0),d:r.d+off+(extra.d||0),z:(r.z||0)+(extra.z||0)}));
}
// opts.arc=[a0,a1] makes an open shell (a=0 is the front); opts.jag offsets alternate verts of the last ring (strand tips)
function loft(R,seg=10,caps=[true,true],opts={}){
  const asc=R.at(-1).y>R[0].y,y0=Math.min(R[0].y,R.at(-1).y),y1=Math.max(R[0].y,R.at(-1).y),S=seg+1,P=[],U=[],I=[];
  const arc=opts.arc,jag=opts.jag||0;
  R.forEach((r,j)=>{for(let i=0;i<=seg;i++){
    const a=arc?arc[0]+i/seg*(arc[1]-arc[0]):i/seg*Math.PI*2+Math.PI;
    let y=r.y;if(jag&&j===R.length-1&&i%2===1)y+=asc?jag:-jag;
    let k=1;if(opts.wrinkle&&j>0&&j<R.length-1){const h=Math.sin((i%seg)*12.9898+j*78.233+(opts.seed||0))*43758.5453;k=1+(h-Math.floor(h)-.5)*opts.wrinkle}
    P.push(Math.sin(a)*r.w*k+(r.x||0),y,Math.cos(a)*r.d*k+(r.z||0));U.push(i/seg,(r.y-y0)/(y1-y0||1));
  }});
  const tri=(a,b,c)=>asc?I.push(a,b,c):I.push(a,c,b);
  for(let j=0;j<R.length-1;j++)for(let i=0;i<seg;i++){const a=j*S+i,b=a+1,c=a+S,d=c+1;tri(a,b,c);tri(b,d,c)}
  const cap=(j,top)=>{const r=R[j],ci=P.length/3;P.push(r.x||0,r.y,r.z||0);U.push(.5,top?1:0);for(let i=0;i<seg;i++){const a=j*S+i,b=a+1;top?tri(ci,a,b):tri(ci,b,a)}};
  if(!arc){if(caps[0])cap(0,false);if(caps[1])cap(R.length-1,true)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);
  g.computeVertexNormals();return g;
}
function mesh(geo,m,name){const o=new THREE.Mesh(geo,m);o.name=name;return o}

/* ================= anatomy (stylised: long legs, narrow waist, slightly larger head) ================= */
const state={style:'Toon',frame:0,skin:2,hair:0,hairColor:1,eyes:0,height:1,build:1,shirt:0,pants:0,jacket:0,shoes:0,socks:0};
const H0=1.625,HS=1.22,HV=1.08,HY=y=>H0+(y-1.565)*HV;   // wider than tall = rounder anime head   // head-space helper (y measured on the original 1.565–1.828 head)
const LEG_END=-.885;

function anatomy(){
  const B=state.frame===1;
  const torso=(B?[
    [.86,.065,.055],[.9,.135,.09],[.96,.172,.11,-.01],[1.01,.164,.104,-.008],[1.06,.134,.088],[1.14,.112,.08],[1.24,.124,.088,.004],[1.33,.142,.108,.018],[1.41,.15,.1,.01],[1.47,.158,.084],[1.52,.098,.06],[1.55,.046,.044]
  ]:[
    [.86,.065,.055],[.9,.128,.088],[.96,.158,.104,-.006],[1.01,.154,.1,-.006],[1.06,.138,.092],[1.14,.124,.084],[1.24,.138,.094,.006],[1.33,.156,.106,.014],[1.41,.176,.1,.008],[1.47,.185,.088],[1.52,.105,.062],[1.55,.048,.046]
  ]).map(([y,w,d,z=0])=>({y,w,d,z}));
  const sh=ringAt(torso,1.47).w-.012;
  const arm=[
    {y:.035,w:.03,d:.034},{y:0,w:.05,d:.054},{y:-.07,w:(B?.046:.053),d:(B?.048:.054)},{y:-.15,w:(B?.038:.044),d:(B?.04:.046)},
    {y:-.27,w:.032,d:.034},{y:-.31,w:(B?.035:.038),d:(B?.036:.039)},{y:-.4,w:(B?.031:.035),d:(B?.03:.032)},{y:-.5,w:.025,d:.021},{y:-.56,w:.022,d:.018}
  ];
  const armK=B?.84:.93;arm.forEach(r=>{r.w*=armK;r.d*=armK});
  const hand=[{y:-.55,w:.02,d:.024},{y:-.585,w:.019,d:.037},{y:-.64,w:.018,d:.042},{y:-.69,w:.015,d:.04},{y:-.73,w:.012,d:.032},{y:-.755,w:.008,d:.02},{y:-.762,w:.003,d:.006}];
  const tw=B?1.07:1;
  const legK=.9;
  const leg=[
    {y:.07,w:.05,d:.05},{y:.03,w:.075*tw,d:.082},{y:0,w:.082*tw,d:.088},{y:-.12,w:.078*tw,d:.084,z:.006},{y:-.28,w:.062,d:.068,z:.004},
    {y:-.43,w:.045,d:.049,z:.002},{y:-.49,w:.046,d:.051,z:.008},{y:-.6,w:.051,d:.057,z:-.014},{y:-.75,w:.032,d:.035,z:-.004},{y:-.84,w:.025,d:.028},{y:LEG_END,w:.026,d:.029}
  ];leg.forEach((r,i)=>{if(i>0){r.w*=legK;r.d*=legK}});
  const foot0=[{y:0,w:.028,d:.032},{y:-.04,w:.036,d:.038,z:.004},{y:-.12,w:.042,d:.028,z:-.006},{y:-.2,w:.04,d:.019,z:-.015},{y:-.24,w:.03,d:.013,z:-.02},{y:-.255,w:.014,d:.007,z:-.022}];const foot=foot0.map(r=>({...r,y:r.y*.86,w:r.w*.88,d:r.d*.86,z:r.z?r.z*.86:0}));
  const neck=B?[{y:1.52,w:.043,d:.044},{y:1.68,w:.037,d:.039,z:-.006}]:[{y:1.52,w:.05,d:.05},{y:1.68,w:.043,d:.045,z:-.006}];
  const head=[
    [1.565,.014,.016,.05],[1.583,.036,.046,.034],[1.612,.056,.072,.014],[1.648,.071,.09,.004],[1.69,.08,.097,0],[1.735,.085,.101,-.004],[1.775,.081,.097,-.008],[1.806,.066,.08,-.01],[1.824,.036,.046,-.01],[1.831,.001,.001,-.01]
  ].map(([y,w,d,z])=>({y:HY(y),w:(w+(!B&&y>1.58&&y<1.66?.006:0))*HS,d:d*HS,z:z*HS}));  // boys: slightly squarer jaw
  return{torso,arm,hand,leg,foot,neck,head,
    joints:{armL:{pos:[sh,1.47,0],rz:.3},armR:{pos:[-sh,1.47,0],rz:-.3},legL:{pos:[.088,.96,0],rz:.025},legR:{pos:[-.088,.96,0],rz:-.025}},
    feet:{L:[.098,.045,-.06],R:[-.098,.045,-.06]}};
}
let A=anatomy();
function jointGroup(j,name){const g=new THREE.Group();g.name=name;g.position.set(...j.pos);g.rotation.z=j.rz;return g}
function footGroup(p,name){const g=new THREE.Group();g.name=name;g.position.set(...p);g.rotation.x=-Math.PI/2;return g}
function onLimbs(parent,kind,make,name){for(const k of kind==='arm'?['armL','armR']:['legL','legR']){const g=jointGroup(A.joints[k],name+'_'+k.slice(-1));g.add(make(k));parent.add(g)}}
function onFeet(parent,make,name){for(const s of ['L','R']){const g=footGroup(A.feet[s],name+'_'+s);g.add(make(s));parent.add(g)}}

/* ================= painted skin & face ================= */
const vOf=(R,y)=>{const a=Math.min(R[0].y,R.at(-1).y),b=Math.max(R[0].y,R.at(-1).y);return(y-a)/(b-a)};   // loft v for a given y
function paintSkin(kind){
  const skin=SKINS[state.skin],W=64,Hh=128,c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');
  x.fillStyle=skin;x.fillRect(0,0,W,Hh);
  const row=v=>(1-v)*Hh,dk=shade(skin,-.14),lt=shade(skin,.1);
  if(kind==='leg'){
    const R=A.leg,kn=row(vOf(R,-.46)),calf=row(vOf(R,-.62)),ank=row(vOf(R,-.86));
    blob(x,32,kn+2,7,5,lt,.55);blob(x,32,kn-6,7,1.5,dk,.25);           // kneecap light + shadow under it
    blob(x,32,(kn+ank)/2,3,Math.abs(kn-ank)/2-6,lt,.25);                        // shin highlight
    blob(x,32,row(vOf(R,-.15)),10,22,lt,.15);                           // thigh sheen
  }else if(kind==='arm'){
    const R=A.arm,el=row(vOf(R,-.29));
    x.fillStyle=dk;x.globalAlpha=.55;x.fillRect(27,el,10,1);x.globalAlpha=1; // inner-elbow crease
    blob(x,2,el,5,4,lt,.35);blob(x,62,el,5,4,lt,.35);                 // elbow point
    blob(x,32,row(vOf(R,-.08)),10,10,lt,.18);                          // shoulder sheen
  }else if(kind==='torso'){
    const R=A.torso,cb=row(vOf(R,1.505)),ch=row(vOf(R,1.27)),nv=row(vOf(R,1.06)),wa=row(vOf(R,1.14));
    x.strokeStyle=dk;x.globalAlpha=.25;x.lineWidth=1;
    for(const s of [-1,1]){x.beginPath();x.moveTo(32+s*3,cb);x.quadraticCurveTo(32+s*10,cb-2,32+s*18,cb+1);x.stroke()} // collarbones
    x.globalAlpha=1;
    blob(x,32,ch,14,5,dk,.1);                                           // chest underside
    blob(x,32,nv,1.2,2,dk,.65);                                          // navel
  }
  return canvasTex(c);
}
const faceCanvas=document.createElement('canvas');faceCanvas.width=faceCanvas.height=128;
const faceTex=canvasTex(faceCanvas);
function paintFace(){
  const c=faceCanvas.getContext('2d'),S=128,skin=SKINS[state.skin],R=A.head;c.imageSmoothingEnabled=false;
  const V=y=>Math.round((1-vOf(R,HY(y)))*S);
  c.fillStyle=skin;c.fillRect(0,0,S,S);
  const ey=V(1.7),lash='#1a120e',hair=HAIRC[state.hairColor],ir=EYES[state.eyes];
  for(const sx of [-1,1]){const x=64+sx*12;
    const girl=state.frame===1;
    c.fillStyle='#f8f6f2';c.fillRect(x-7,ey-7,14,13);                       // tall eye white
    c.fillStyle=shade(ir,-.2);c.fillRect(x-4-sx,ey-7,8,13);                 // iris (dark top)
    c.fillStyle=ir;c.fillRect(x-4-sx,ey-2,8,8);                             // iris mid
    c.fillStyle=shade(ir,.2);c.fillRect(x-3-sx,ey+3,6,3);                   // iris glow bottom
    c.fillStyle='#0b0908';c.fillRect(x-2-sx,ey-4,4,6);                      // pupil
    c.fillStyle='#ffffff';c.fillRect(x-3-sx,ey-5,3,3);c.fillRect(x+1-sx,ey+2,1,1); // highlights
    c.fillStyle=lash;c.fillRect(x-8,ey-9,16,3);                              // thick upper lash
    if(girl){c.fillRect(x+sx*7,ey-10,3,2);c.fillRect(x+sx*9-(sx<0?1:0),ey-11,2,2)}else{c.fillStyle=shade(skin,-.05);c.fillRect(x-7,ey-7,14,2);c.fillStyle=lash} // girl: lash wing; boy: flatter lid
    c.fillStyle=shade(skin,-.3);c.fillRect(x-5,ey+6,10,1);                  // lower lash
    c.fillStyle=hair;if(girl){c.fillRect(x-6,ey-16,12,2);c.fillRect(x+(sx>0?4:-8),ey-15,4,1)}else{c.fillRect(x-7,ey-15,14,3)} // brow
    c.fillStyle=mix(skin,'#ff8a8a',.35);c.globalAlpha=girl?.45:.15;c.fillRect(x-5+sx*2,ey+9,9,2);c.globalAlpha=1; // blush
  }
  const ny=V(1.662);c.fillStyle=shade(skin,-.16);c.fillRect(63,ny,2,1);      // nose hint
  const my=V(1.625),lip=mix(skin,'#c0505c',state.frame===1?.45:.15);
  c.fillStyle=shade(lip,-.25);c.fillRect(60,my,8,1);c.fillStyle=lip;c.fillRect(62,my+1,4,1);
  c.fillStyle=shade(skin,-.08);c.fillRect(0,V(1.588),S,3);
  faceTex.needsUpdate=true;
}

function clampTarget(){const t=controls.target;t.x=THREE.MathUtils.clamp(t.x,-.5,.5);t.z=THREE.MathUtils.clamp(t.z,-.5,.5);t.y=THREE.MathUtils.clamp(t.y,.05,1.95)}

let fly=null;
function flyTo(p,t){fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t),k:0}}

  camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(fly.k>=1)fly=null}

{const base=new THREE.Mesh(new THREE.CylinderGeometry(.5,.54,.06,8),new THREE.MeshStandardMaterial({color:0xfbe1ec,flatShading:true,roughness:1}));base.position.y=-.03;plinth.add(base);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.012,4,8),new THREE.MeshStandardMaterial({color:0xd6457f,flatShading:true}));ring.rotation.set(Math.PI/2,0,Math.PI/8);plinth.add(ring);}

function clear(g){const geos=new Set();g.traverse(o=>{if(o.geometry)geos.add(o.geometry)});geos.forEach(x=>x.dispose());g.clear()}
function outline(g){
  if(state.style!=='Toon')return;
  const ms=[];g.traverse(o=>{if(o.isMesh&&!o.userData.outline&&!['Nose','Ear','Thumb'].includes(o.name))ms.push(o)});
  for(const m of ms){const o=new THREE.Mesh(m.geometry,outlineMat);o.userData.outline=true;o.name='Outline';o.raycast=()=>{};m.add(o)}
}

/* ================= builders ================= */
function buildBody(){
  clear(G.body);const B=G.body;
  const skin=plain(SKINS[state.skin],'Skin');
  const torsoM=mat({map:paintSkin('torso')},'SkinTorso'),armM=mat({map:paintSkin('arm')},'SkinArm'),legM=mat({map:paintSkin('leg')},'SkinLeg');
  B.add(mesh(loft(A.torso,12),torsoM,'Torso'));
  B.add(mesh(loft(A.neck,8,[false,false]),skin,'Neck'));
  paintFace();B.add(mesh(loft(A.head,12),mat({map:faceTex},'Face'),'Head'));
  onLimbs(B,'arm',()=>{const g=new THREE.Group();g.add(mesh(loft(A.arm,8),armM,'Arm'));{const h=mesh(loft(A.hand,6),skin,'Hand');h.scale.set(.85,.85,.85);h.position.y=-.56*.15;g.add(h)}
    const th=mesh(loft([{y:0,w:.01,d:.011},{y:-.042,w:.007,d:.008},{y:-.047,w:.002,d:.002}],5),skin,'Thumb');th.position.set(0,-.585*.85-.56*.15,.024);th.scale.setScalar(.85);th.rotation.x=-.55;g.add(th);return g},'Arm');
  onLimbs(B,'leg',()=>mesh(loft(A.leg,8),legM,'Leg'),'Leg');
  onFeet(B,()=>mesh(loft(A.foot,8),skin,'Foot'),'Foot');
  for(const x of [.08*HS,-.08*HS]){const ear=mesh(new THREE.BoxGeometry(.01,.032,.02),skin,'Ear');ear.position.set(x*1.04,HY(1.695),-.01);ear.rotation.y=x>0?.2:-.2;B.add(ear)}
  outline(B);
}
function hairShell(yTop,yBot,off0,off1,arc,jag,extraZ=0){
  // hangs straight down from the widest part of the head, flaring slightly, with jagged strand tips
  const R=A.head,wMax=ringAt(R,HY(1.735)).w,dMax=ringAt(R,HY(1.735)).d,n=6,rings=[];
  for(let i=0;i<=n;i++){const t=i/n,y=yTop+(yBot-yTop)*t,r=ringAt(R,Math.max(y,R[0].y)),o=off0+(off1-off0)*t;
    rings.push({y,w:Math.max(r.w,wMax*(1-.04*t))+o,d:Math.max(r.d,dMax*(1-.1*t))+o,z:(r.z||0)*(1-t)+extraZ*t})}
  return loft(rings,20,[false,false],{arc,jag});
}
function buildHair(){
  clear(G.hair);const st=HAIRS[state.hair];if(st==='None')return;
  const m=mat({color:HAIRC[state.hairColor],side:THREE.DoubleSide},'Hair'),H=G.hair,R=A.head,top=R.at(-1).y,P=Math.PI;
  const cap=(from,off)=>mesh(loft(sub(R,HY(from),top,off),14,[false,true]),m,'HairCap');
  const fringe=(to,swept=0)=>mesh(hairShell(HY(1.8),HY(to),.02,.026,[-1.1+swept,1.1+swept],.022),m,'Fringe');
  if(st==='Buzz'){H.add(cap(1.722,.005));outline(H);return}
  if(st==='Bob'){H.add(cap(1.735,.017));H.add(mesh(hairShell(HY(1.77),HY(1.605),.019,.034,[.8,2*P-.8],.026),m,'BobShell'));H.add(fringe(1.735))}
  if(st==='Pixie'){H.add(cap(1.735,.016));H.add(mesh(hairShell(HY(1.77),HY(1.66),.017,.022,[.95,2*P-.95],.024),m,'PixieBack'));H.add(fringe(1.742,.35))}
  if(st==='Long'){H.add(cap(1.735,.017));H.add(mesh(hairShell(HY(1.77),1.42,.019,.05,[.85,2*P-.85],.04,-.05),m,'LongShell'));H.add(fringe(1.73,-.2))}
  if(st==='Bun'){H.add(cap(1.7,.01));const b=mesh(new THREE.IcosahedronGeometry(.05,1),m,'Bun');b.position.set(0,HY(1.8),-.095);H.add(b)}
  if(st==='Puff'){const p=mesh(new THREE.IcosahedronGeometry(.145,1),m,'Puff');p.position.set(0,HY(1.775),-.02);p.scale.set(1,.88,1);H.add(p)}
  // point on the head surface at angle a (0 = front) and original-head height y
  const onHead=(a,y,out=0)=>{const r=ringAt(R,HY(y));return[Math.sin(a)*(r.w+out),HY(y),Math.cos(a)*(r.d+out)+(r.z||0)]};
  // a tube that starts at p and travels along dir with drift, as merged-friendly geometry
  const tube=(p,len,r0,r1,dx,dz,steps=6,seg=6)=>{const rs=[];for(let i=0;i<=steps;i++){const t=i/steps;rs.push({y:p[1]-len*t,w:r0+(r1-r0)*t,d:r0+(r1-r0)*t,x:p[0]+dx*t*t,z:p[2]+dz*t})}return loft(rs,seg)};
  const merged=(geos,name)=>{const g=mergeGeometries(geos);geos.forEach(x=>x.dispose());return mesh(g,m,name)};
  if(st==='Wolf Cut'){
    H.add(cap(1.725,.024));
    H.add(mesh(hairShell(HY(1.8),HY(1.67),.024,.036,[.7,2*P-.7],.034),m,'WolfLayer1'));
    H.add(mesh(hairShell(HY(1.72),HY(1.555),.03,.05,[1.5,2*P-1.5],.04,-.025),m,'WolfMullet'));
    H.add(mesh(hairShell(HY(1.82),HY(1.715),.026,.032,[-1.15,1.15],.03),m,'WolfFringe'));
  }
  if(st==='Curtains'){
    H.add(cap(1.735,.017));H.add(mesh(hairShell(HY(1.77),HY(1.62),.019,.03,[.85,2*P-.85],.02),m,'CurtainBack'));
    H.add(mesh(hairShell(HY(1.81),HY(1.64),.022,.032,[.5,1.45],.024),m,'CurtainL'));
    H.add(mesh(hairShell(HY(1.81),HY(1.64),.022,.032,[-1.45,-.5],.024),m,'CurtainR'));
  }
  if(st==='Ponytail'){
    H.add(cap(1.715,.013));H.add(mesh(hairShell(HY(1.8),HY(1.745),.016,.02,[-1,1],.014),m,'Fringe'));
    const p=onHead(P,1.77,.01);H.add(mesh(tube([p[0],p[1],p[2]-.01],.36,.034,.012,0,-.06,8,8),m,'Ponytail'));
    const band=mesh(new THREE.TorusGeometry(.03,.009,6,10),plain(shade(HAIRC[state.hairColor],-.25),'HairTie'),'HairTie');band.position.set(p[0],p[1]-.02,p[2]-.012);band.rotation.x=Math.PI/2;H.add(band);
  }
  if(st==='Twin Tails'){
    H.add(cap(1.72,.014));H.add(fringe(1.735));
    for(const sx of [-1,1]){const p=onHead(sx*P*.62,1.79,.012);H.add(mesh(tube(p,.42,.034,.01,sx*.07,-.03,8,8),m,'TwinTail'))}
  }
  if(st==='Space Buns'){
    H.add(cap(1.715,.013));H.add(fringe(1.74));
    for(const sx of [-1,1]){const b=mesh(new THREE.IcosahedronGeometry(.055,1),m,'SpaceBun');const p=onHead(sx*1.15,1.81,.02);b.position.set(...p);H.add(b)}
  }
  if(st==='Braids'){
    H.add(cap(1.715,.014));H.add(mesh(hairShell(HY(1.81),HY(1.735),.018,.022,[-1.05,1.05],.016),m,'Fringe'));
    const geos=[];
    for(const sx of [-1,1]){const p=onHead(sx*P*.58,1.69,.01);
      for(let i=0;i<9;i++){const g=new THREE.IcosahedronGeometry(.024-i*.0011,0);g.translate(p[0]+sx*.006*(i%2?1:-1),p[1]-i*.038,p[2]-.01);geos.push(g)}}
    H.add(merged(geos,'Braids'));
  }
  if(st==='Dreads'){
    H.add(cap(1.715,.016));
    const geos=[],r=rng(state.hairColor*13+7);
    for(let i=0;i<26;i++){const a=.55+i/25*(2*P-1.1),row=i%2;
      const p=onHead(a,1.78-row*.05,.014),len=.26+r()*.12-(Math.abs(Math.sin(a))>.9?.04:0);
      geos.push(tube(p,len,.013,.009,Math.sin(a)*.025,Math.cos(a)*.025-.01,6,5))}
    for(let i=0;i<7;i++){const a=-.55+i/6*1.1,p=onHead(a,1.8,.014);geos.push(tube(p,.07+r()*.03,.012,.009,Math.sin(a)*.02,.03,4,5))}
    H.add(merged(geos,'Dreads'));
  }
  if(st==='Mohawk'){
    H.add(cap(1.722,.004));
    for(let i=0;i<7;i++){const a=-.45+i/6*1.9,c=mesh(new THREE.ConeGeometry(.035,.1,4),m,'MohawkSpike');
      const y=HY(1.8)+Math.cos(a)*.05,z=Math.sin(a)*.09-.01;c.position.set(0,y,z);c.rotation.x=a*.8;c.scale.set(.4,1,1);H.add(c)}
  }
  if(st==='Spiky'){H.add(cap(1.73,.012));for(let i=0;i<10;i++){const a=(i/10-.5)*P*1.5,c=mesh(new THREE.ConeGeometry(.032,.09,4),m,'Spike');c.position.set(Math.sin(a)*.055,HY(1.815),Math.cos(a)*.055-.02);c.rotation.set(Math.cos(a)*.65,0,-Math.sin(a)*.65);H.add(c)}}
  outline(H);
}
/* ---------- drape: fabric hangs instead of hugging ---------- */
const CLOTH={wrinkle:.05};
// densify a ring list so drapes bend smoothly
function dense(R,n=3){const out=[];for(let i=0;i<R.length-1;i++){for(let k=0;k<n;k++)out.push(lerpRing(R[i],R[i+1],k/n))}out.push(R.at(-1));return out}
// torso: below the chest, cloth falls straight from the chest/shoulders (never pulls in at the waist), with optional flare
function drapeTorso(R,off,flare=0,ease=.97){
  const chest=A.torso.filter(r=>r.y>1.2&&r.y<1.45).reduce((a,r)=>r.w>a.w?r:a);
  const ymin=Math.min(...R.map(r=>r.y));
  return dense(R).map(r=>{
    if(r.y>=chest.y)return{...r,w:r.w+off,d:r.d+off};
    const t=(chest.y-r.y)/(chest.y-ymin||1);
    return{...r,w:Math.max(r.w,chest.w*ease)+off+flare*t,d:Math.max(r.d,chest.d*ease)+off+flare*t*.75,z:(r.z||0)*(1-t)+(chest.z||0)*t*.5};
  });
}
// limbs: radius follows a loose profile from the shoulder/thigh down; cuff=true gathers the last bit
function drapeLimb(R,ref,off,profile,cuff=false){
  const top=R[0].y,bot=R.at(-1).y,D=dense(R);
  const out=D.map(r=>{const t=(top-r.y)/(top-bot||1),p=profile(t);
    return{...r,w:Math.max(r.w+off,ref.w*p+off),d:Math.max(r.d+off,ref.d*p+off)}});
  if(cuff){const last=out.at(-1),src=D.at(-1),cy=last.y+.035;
    out.splice(out.length-1,0,{...ringAt(out,cy),y:cy});out[out.length-1]={...last,w:src.w+off+.006,d:src.d+off+.006}}
  return out;
}
const DS={side:THREE.DoubleSide};
const clothMatDS=(it,name)=>mat({map:texFor(it),...DS},name);

function buildShirt(){
  clear(G.shirt);if(!state.shirt)return;const it=CAT.shirt[state.shirt-1],m=clothMatDS(it,'Shirt'),o=.01;
  const hem=it.cut==='Tank'?.98:.95;
  G.shirt.add(mesh(loft(drapeTorso(sub(A.torso,hem,1.53,0),o,.012),14,[false,false],{...CLOTH,seed:1}),m,'ShirtBody'));
  G.shirt.add(mesh(loft([{y:1.515,w:.066,d:.063},{y:1.538,w:.062,d:.06}],10,[false,false]),plain(shade(it.c1,-.15),'Collar'),'Collar'));
  if(it.cut!=='Tank'){
    const ref=ringAt(A.arm,-.02);
    const sleeve=it.cut==='Tee'
      ?drapeLimb(sub(A.arm,.035,-.21,0),ref,o,t=>.92+.14*t)                       // short, open, slightly bell-shaped
      :drapeLimb(sub(A.arm,.035,-.55,0),ref,o,t=>.92-.18*t,true);                 // loose long sleeve, gathered cuff
    onLimbs(G.shirt,'arm',()=>mesh(loft(sleeve,9,[true,false],{...CLOTH,seed:2}),m,'Sleeve'),'Sleeve');
  }
  outline(G.shirt);
}
function buildPants(){
  clear(G.pants);if(!state.pants)return;const it=CAT.pants[state.pants-1],m=clothMatDS(it,'Pants'),o=.012;
  const hipW=Math.max(...A.torso.filter(r=>r.y<1.05).map(r=>r.w)),hipD=Math.max(...A.torso.filter(r=>r.y<1.05).map(r=>r.d));
  // loose seat: below the waistband the fabric sits out at hip width; the crotch drops a little
  const seat=dense(sub(A.torso,.86,1.09,0)).map(r=>r.y>1.02?{...r,w:r.w+o,d:r.d+o}:{...r,w:Math.max(r.w,hipW*(r.y<.9?.82:.99))+o,d:Math.max(r.d,hipD*(r.y<.9?.86:.99))+o});
  seat[0]={...seat[0],y:.84,w:.1,d:.07};
  G.pants.add(mesh(loft(seat,14,[true,false],{...CLOTH,seed:3}),m,'PantsSeat'));
  G.pants.add(mesh(loft(sub(A.torso,1.07,1.1,o+.004),12,[false,false]),plain(shade(it.c1,-.22),'Waistband'),'Waistband'));
  const ref=ringAt(A.leg,-.06);
  const prof={Jeans:t=>1.02-.36*t,Shorts:t=>1.04+.1*t,Capris:t=>1.02-.22*t}[it.cut];  // straight-leg taper / flared shorts
  const len={Jeans:-.87,Shorts:-.32,Capris:-.66}[it.cut];
  onLimbs(G.pants,'leg',()=>mesh(loft(drapeLimb(sub(A.leg,.03,len,0),ref,o,prof),10,[false,false],{...CLOTH,seed:4}),m,'PantLeg'),'PantLeg');
  outline(G.pants);
}
function buildSocks(){
  clear(G.socks);if(!state.socks)return;const it=CAT.socks[state.socks-1],m=clothMat(it,'Socks');
  const top={Ankle:-.84,Crew:-.7,'Knee-high':-.48}[it.cut];
  onLimbs(G.socks,'leg',()=>mesh(loft(sub(A.leg,top,LEG_END,.004),8,[false,true]),m,'Sock'),'Sock');
  onFeet(G.socks,()=>mesh(loft(sub(A.foot,0,-.255,.004),8),m,'SockFoot'),'SockFoot');
  outline(G.socks);
}
function buildShoes(){
  clear(G.shoes);if(!state.shoes)return;const it=CAT.shoes[state.shoes-1],m=clothMat(it,'Shoes');
  const sole=plain(it.cut==='Sneakers'?'#f1ede4':'#2a211b','Sole'),off=it.cut==='Boots'?.016:.011;
  onFeet(G.shoes,()=>{const g=new THREE.Group();
    g.add(mesh(loft(it.cut==='Loafers'?sub(A.foot,-.02,-.255,off):sub(A.foot,.005,-.255,off),8),m,'Upper'));
    g.add(mesh(loft(sub(A.foot,.01,-.258,off+.004,{d:-.02,z:-.018}),8),sole,'Sole'));
    if(it.cut==='Sneakers'){const l=mesh(new THREE.BoxGeometry(.04,.06,.008),plain('#ffffff','Laces'),'Laces');l.position.set(0,-.09,.04);l.rotation.x=.35;g.add(l)}
    return g},'Shoe');
  if(it.cut==='Boots')onLimbs(G.shoes,'leg',()=>mesh(loft(sub(A.leg,-.7,LEG_END,.018),8,[true,false]),m,'BootShaft'),'BootShaft');
  outline(G.shoes);
}
function buildJacket(){
  clear(G.jacket);if(!state.jacket)return;const it=CAT.jacket[state.jacket-1],m=clothMatDS(it,'Jacket'),o=.032;
  const trim=plain(shade(it.c1,-.22),'JacketTrim');
  let body=drapeTorso(sub(A.torso,it.cut==='Bomber'?1.0:.93,1.53,0),o,it.cut==='Hoodie'?.016:.006,1.0);   // boxy: hangs from the shoulders
  if(it.cut==='Trench'){const b=body[0];body=[{...b,y:.56,w:b.w+.075,d:b.d+.06},{...b,y:.76,w:b.w+.045,d:b.d+.035},...body]}
  if(it.cut==='Bomber'){const b=body[0];body=[{...b,y:.97,w:b.w-.022,d:b.d-.018},{...b,y:.99,w:b.w-.02,d:b.d-.016},...body]}   // gathered waistband
  G.jacket.add(mesh(loft(body,14,[false,false],{...CLOTH,seed:5}),m,'JacketBody'));
  const ref=ringAt(A.arm,-.02),sp={Hoodie:t=>1.0-.12*t,Bomber:t=>1.02-.1*t,Trench:t=>.98+.04*t}[it.cut];
  const sleeve=drapeLimb(sub(A.arm,.035,-.53,0),ref,.026,sp,it.cut!=='Trench');
  onLimbs(G.jacket,'arm',()=>mesh(loft(sleeve,9,[true,false],{...CLOTH,seed:6}),m,'JacketSleeve'),'JacketSleeve');
  const frontZ=y=>{const r=ringAt(body,y);return r.d+(r.z||0)+.004};
  if(it.cut!=='Hoodie'){const z=mesh(new THREE.BoxGeometry(.008,.46,.006),trim,'Zip');z.position.set(0,1.25,frontZ(1.25));G.jacket.add(z)}
  if(it.cut==='Hoodie'){
    G.jacket.add(mesh(loft([{y:1.5,w:.135,d:.095,z:-.05},{y:1.56,w:.125,d:.105,z:-.062},{y:1.63,w:.085,d:.075,z:-.088}],10),m,'Hood'));
    const p=mesh(new THREE.BoxGeometry(.2,.1,.016),m,'Pocket');p.position.set(0,1.04,frontZ(1.04));G.jacket.add(p);
  }
  if(it.cut==='Bomber')G.jacket.add(mesh(loft([{y:1.51,w:.088,d:.083},{y:1.56,w:.078,d:.075}],10,[false,false]),trim,'Collar'));
  if(it.cut==='Trench'){const bl=ringAt(body,1.1);G.jacket.add(mesh(loft([{...bl,y:1.09,w:bl.w+.006,d:bl.d+.006},{...bl,y:1.12,w:bl.w+.006,d:bl.d+.006}],14,[false,false]),trim,'Belt'));G.jacket.add(mesh(loft([{y:1.49,w:.135,d:.105,z:.005},{y:1.56,w:.092,d:.082}],10,[false,false]),m,'Lapel'))}
  outline(G.jacket);
}
const BUILD={shirt:buildShirt,pants:buildPants,jacket:buildJacket,shoes:buildShoes,socks:buildSocks};
function buildAll(){A=anatomy();buildBody();buildHair();for(const k in BUILD)BUILD[k]();applyShape();updateWear()}
function applyShape(){root.scale.set(state.build,state.height,state.build)}

/* ================= UI ================= */
const TABS=[['body','Body'],['shirt','Shirts'],['pants','Pants'],['jacket','Jackets'],['shoes','Shoes'],['socks','Socks']];
let tab='body',query='',cutFilter='';
const tabsEl=document.getElementById('tabs'),pane=document.getElementById('pane');
function renderTabs(){tabsEl.innerHTML='';for(const [k,l] of TABS){const b=document.createElement('button');b.className='tab'+(tab===k?' on':'');b.textContent=l;b.onclick=()=>{tab=k;query='';cutFilter='';renderTabs();renderPane()};tabsEl.appendChild(b)}}
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
function swatches(label,list,key,onPick){
  const r=el(`<div class="row"><label>${label}</label><div class="sw"></div></div>`),w=r.lastChild;
  list.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.className=state[key]===i?'on':'';b.setAttribute('aria-label',label+' '+(i+1));b.onclick=()=>{state[key]=i;onPick();renderPane()};w.appendChild(b)});return r}
function chips(label,list,key,onPick,byValue=false){
  const r=el(`<div class="row"><label>${label}</label><div class="chips"></div></div>`),w=r.lastChild;
  list.forEach((c,i)=>{const v=byValue?c:i,b=document.createElement('button');b.textContent=c;b.className='chip'+(state[key]===v?' on':'');b.onclick=()=>{state[key]=v;onPick();renderPane()};w.appendChild(b)});return r}
function slider(label,key,min,max){
  const r=el(`<div class="row"><label>${label}</label></div>`),s=document.createElement('input');s.type='range';s.min=min;s.max=max;s.step=.01;s.value=state[key];s.oninput=()=>{state[key]=+s.value;applyShape()};r.appendChild(s);return r}
function renderPane(){
  pane.innerHTML='';
  if(tab==='body'){
    pane.appendChild(el(`<div class="ph"><h2>Body</h2><span>Base mannequin</span></div>`));
    pane.appendChild(chips('Render style',STYLES,'style',buildAll,true));
    pane.appendChild(chips('Gender',FRAMES,'frame',buildAll));
    pane.appendChild(swatches('Skin tone',SKINS,'skin',buildBody));
    pane.appendChild(chips('Hair',HAIRS,'hair',buildHair));
    pane.appendChild(swatches('Hair color',HAIRC,'hairColor',()=>{buildHair();buildBody()}));
    pane.appendChild(swatches('Eye color',EYES,'eyes',buildBody));
    pane.appendChild(slider('Height','height',.9,1.1));
    pane.appendChild(slider('Build','build',.88,1.18));
    return;
  }
  const list=CAT[tab],label=TABS.find(t=>t[0]===tab)[1];
  pane.appendChild(el(`<div class="ph"><h2>${label}</h2><span>${list.length} styles</span></div>`));
  const grid=document.createElement('div');grid.className='grid';
  if(list.length>3){
    const s=el(`<input class="search" placeholder="Search by colour, pattern or number">`);s.value=query;s.oninput=()=>{query=s.value;fill()};pane.appendChild(s);
    const f=el(`<div class="filters"></div>`);
    ['All',...new Set(list.map(i=>i.cut))].forEach(c=>{const b=el(`<button class="chip">${c}</button>`);const v=c==='All'?'':c;if(cutFilter===v)b.classList.add('on');b.onclick=()=>{cutFilter=v;f.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));fill()};f.appendChild(b)});
    pane.appendChild(f);
  }
  pane.appendChild(grid);
  function fill(){
    grid.innerHTML='';const q=query.trim().toLowerCase();
    const items=list.filter(it=>(!cutFilter||it.cut===cutFilter)&&(!q||it.name.toLowerCase().includes(q)||String(it.id)===q.replace('#','')));
    const none=el(`<button class="card${state[tab]===0?' on':''}"><div class="none">None</div><b>—</b><i>Nothing</i></button>`);none.onclick=()=>pick(0);grid.appendChild(none);
    for(const it of items){const b=el(`<button class="card${state[tab]===it.id?' on':''}" title="${it.name}"><img alt="" src="${thumbFor(it)}"><b>#${String(it.id).padStart(2,'0')}</b><i>${it.name}</i></button>`);b.onclick=()=>pick(it.id);grid.appendChild(b)}
  }
  function pick(id){state[tab]=id;BUILD[tab]();updateWear();fill()}
  fill();
}
function updateWear(){
  const w=document.getElementById('wear');w.innerHTML='<span class="lbl">Wearing</span>';
  let any=false;
  for(const k of ['shirt','pants','jacket','shoes','socks']){if(!state[k])continue;any=true;
    const p=el(`<span class="pill">${CAT[k][state[k]-1].name}<button aria-label="Remove">×</button></span>`);p.lastChild.onclick=()=>{state[k]=0;BUILD[k]();updateWear();if(tab===k)renderPane()};w.appendChild(p)}
  if(!any)w.appendChild(el('<span class="nothing">Nothing yet</span>'));
  document.getElementById('empty').style.display=any?'none':'';
}
const toastEl=document.getElementById('toast');let tt;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2600)}
document.getElementById('random').onclick=()=>{
  const r=n=>Math.floor(Math.random()*n);
  Object.assign(state,{frame:r(2),skin:r(SKINS.length),hair:1+r(HAIRS.length-1),hairColor:r(HAIRC.length),eyes:r(EYES.length),shirt:1+r(99),pants:1+r(99),jacket:Math.random()<.4?1+r(99):0,shoes:1+r(99),socks:1+r(3)});
  buildAll();renderPane();
};
document.getElementById('reset').onclick=()=>{for(const k in BUILD)state[k]=0;buildAll();renderPane()};

/* ================= GLB export ================= */
let downloads=null;
try{window.claude?.use?.('downloads').then(d=>{downloads=d}).catch(()=>{})}catch(e){}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(d){let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipOne(name,data){
  const nb=new TextEncoder().encode(name),crc=crc32(data),L=data.length;
  const put=(dv,arr)=>arr.forEach(([o,v,s])=>s===4?dv.setUint32(o,v,true):dv.setUint16(o,v,true));
  const lh=new DataView(new ArrayBuffer(30));put(lh,[[0,0x04034b50,4],[4,20,2],[12,0x21,2],[14,crc,4],[18,L,4],[22,L,4],[26,nb.length,2]]);
  const cd=new DataView(new ArrayBuffer(46));put(cd,[[0,0x02014b50,4],[4,20,2],[6,20,2],[14,0x21,2],[16,crc,4],[20,L,4],[24,L,4],[28,nb.length,2]]);
  const end=new DataView(new ArrayBuffer(22));put(end,[[0,0x06054b50,4],[8,1,2],[10,1,2],[12,46+nb.length,4],[16,30+nb.length+L,4]]);
  return new Blob([lh,nb,data,cd,nb,end]);
}
function setOutlines(v){root.traverse(o=>{if(o.userData.outline)o.visible=v})}
document.getElementById('export').onclick=()=>{
  toast('Building .glb…');setOutlines(false);root.updateMatrixWorld(true);
  new GLTFExporter().parse(root,async buf=>{
    setOutlines(true);
    const bytes=new Uint8Array(buf),kb=(bytes.length/1024).toFixed(0);
    if(downloads){
      try{await downloads.save({filename:'heemsworld-character.zip',data:zipOne('heemsworld-character.glb',bytes)});toast(`Saved heemsworld-character.glb (${kb} KB, in a .zip)`)}
      catch(e){toast(e?.code==='declined'?'Export cancelled':'Export failed: '+(e?.message||e?.code||e))}
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'model/gltf-binary'}));a.download='heemsworld-character.glb';document.body.appendChild(a);a.click();a.remove();
      toast(`Exported heemsworld-character.glb (${kb} KB)`);
    }
  },err=>{setOutlines(true);toast('Export failed: '+err)},{binary:true,onlyVisible:true});
};

/* ================= loop ================= */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
renderer.setAnimationLoop(()=>{stepFly();clampTarget();controls.update();renderer.render(scene,camera)});
buildAll();renderTabs();renderPane();
window.__heems={root,state,CAT,buildAll,camera,controls,view,exportTest:()=>new Promise((res,rej)=>{setOutlines(false);new GLTFExporter().parse(root,b=>{setOutlines(true);res(b.byteLength)},rej,{binary:true,onlyVisible:true})})};
</script>
</body>
